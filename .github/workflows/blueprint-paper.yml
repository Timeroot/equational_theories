name: Deploy website

on:
  push:
    branches: [definability-negative]
    paths:
      - 'home_page/**'
      - 'website_data/**'
      - 'scripts/website_data.py'
      - 'scripts/test_research_*.mjs'
      - '.github/workflows/blueprint-paper.yml'
  pull_request:
    paths:
      - 'home_page/**'
      - 'website_data/**'
      - 'scripts/website_data.py'
      - 'scripts/test_research_*.mjs'
      - '.github/workflows/blueprint-paper.yml'
  workflow_dispatch:

# Publishing consumes the locally verified bundle. No Lean or TeX build runs here.
permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Restore and verify precomputed data
        run: python3 scripts/website_data.py unpack
      - name: Check explorers and proof reconstruction
        run: |
          node scripts/test_research_proofs.mjs
          node scripts/test_research_site.mjs
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./home_page
          destination: ./_site
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/definability-negative'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
